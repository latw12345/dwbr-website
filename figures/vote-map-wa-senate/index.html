<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WA DWBR Vote Map · Senate · 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--paper);
  color: var(--ink);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#map-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
}

svg#map {
  display: block;
  width: 100%;
  height: 100%;
}

.district {
  stroke: var(--paper);
  stroke-width: 0.6px;
  cursor: pointer;
  transition: stroke-width 0.1s;
}

.district:hover {
  stroke: #fff;
  stroke-width: 1.8px;
}

.slider-group {
  cursor: ew-resize;
}

.compare-label {
  position: absolute;
  top: 14px;
  width: 80px;
  text-align: center;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(74, 95, 88, 0.45);
  pointer-events: none;
  z-index: 5;
  display: none;
}
#compare-label-left  { left: 0; }
#compare-label-right { right: 0; }

#tooltip {
  position: absolute;
  pointer-events: none;
  background: #fff;
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 10px 13px;
  box-shadow: 0 4px 18px rgba(74,95,88,.13);
  font-size: 13px;
  min-width: 180px;
  max-width: 260px;
  opacity: 0;
  transition: opacity 0.1s;
  z-index: 10;
}

.tt-dist {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 7px;
}

.tt-agg {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  margin-bottom: 8px;
  padding-bottom: 7px;
  border-bottom: 1px solid #eef3f1;
  color: var(--ink);
}

.tt-compare-label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #b0b8b4;
  margin-bottom: 4px;
}

.tt-sep {
  border-top: 1px solid #eef3f1;
  margin: 5px 0 6px;
}

.tt-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 2px 0;
}

.tt-name {
  font-size: 13px;
  font-weight: 600;
  color: #1a2820;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tt-party {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .06em;
  padding: 1px 5px;
  border-radius: 3px;
  flex-shrink: 0;
}
.tt-party.D { background: #dbe8f5; color: #1d5fa8; }
.tt-party.R { background: #f5dbe0; color: #b02020; }

.tt-vote {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  flex-shrink: 0;
}
.tt-vote.Yea     { color: #3d6b5e; }
.tt-vote.Nay     { color: #8b3a3a; }
.tt-vote.Excused { color: var(--ink-3); }
.tt-vote.No-Vote { color: var(--ink-3); }

.bottom-bar {
  padding: 8px 0 10px;
  text-align: center;
  background: var(--paper);
}

.controls-row {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  flex-wrap: nowrap;
  background: rgba(245,247,246,.97);
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  box-shadow: 0 2px 12px rgba(74,95,88,.07);
}

.chamber-btn {
  padding: 4px 14px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-3);
  cursor: pointer;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  transition: all .18s;
  flex-shrink: 0;
}

.chamber-btn.active {
  background: var(--sage);
  color: #fff;
  border-color: var(--sage-deep);
}

.chamber-btn:not(.active):hover {
  background: var(--sage-tint);
  color: var(--ink);
}

.bar-sep {
  width: 1px;
  height: 16px;
  background: var(--rule);
  flex-shrink: 0;
}

.legend {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  flex-wrap: nowrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
  white-space: nowrap;
}

.legend-swatch {
  width: 11px;
  height: 11px;
  border-radius: 2px;
  flex-shrink: 0;
}
</style>
</head>
<body>

<div id="map-wrap">
  <svg id="map"></svg>
  <div id="compare-label-left"  class="compare-label">2020</div>
  <div id="compare-label-right" class="compare-label">2026</div>
  <div id="tooltip"></div>
</div>

<div class="bottom-bar">
  <div class="controls-row">
    <button class="chamber-btn" id="btn-compare">Compare 2020</button>
    <div class="bar-sep"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
const SENATE_COLORS = {
  "Yea":     "#4a7c6e",
  "Nay":     "#a04040",
  "Excused": "#b0b0b0",
};
const BASE_COLOR = "#dde8e3";

const SENATE_LEGEND = [
  { color:"#4a7c6e", label:"Yea" },
  { color:"#a04040", label:"Nay" },
  { color:"#b0b0b0", label:"Excused" },
];

let compareMode = false;
let sliderX = null;
let senateGeo = null;
let senateGeo2020 = null;
let lookup2020 = null, lookup2026 = null;

const tooltip = document.getElementById("tooltip");
const mapWrap = document.getElementById("map-wrap");

const svg = d3.select("#map");
const defs = svg.append("defs");
const clipRect = defs.append("clipPath").attr("id", "clip-2026").append("rect");
const g2020 = svg.append("g");
const g2026 = svg.append("g").attr("clip-path", "url(#clip-2026)");

const sliderGroup = svg.append("g").attr("class", "slider-group").style("display", "none");
const sliderHit = sliderGroup.append("rect").attr("fill", "transparent").attr("y", 0).attr("width", 32);
const sliderLine = sliderGroup.append("line").attr("stroke", "#fff").attr("stroke-width", 2).attr("pointer-events", "none");
const sliderHandle = sliderGroup.append("circle")
  .attr("r", 18).attr("fill", "#fff")
  .attr("stroke", "#dde8e3").attr("stroke-width", 1.5)
  .attr("filter", "drop-shadow(0 2px 6px rgba(74,95,88,.18))")
  .attr("pointer-events", "none");
sliderGroup.append("text")
  .attr("text-anchor", "middle").attr("dominant-baseline", "central")
  .attr("font-family", "system-ui, sans-serif").attr("font-size", 10)
  .attr("fill", "#7f918a").attr("pointer-events", "none")
  .text("◀ ▶");

function dims() {
  return { W: mapWrap.clientWidth, H: mapWrap.clientHeight };
}

function buildProjection(geo) {
  const { W, H } = dims();
  return d3.geoMercator().fitExtent([[16, 16], [W - 16, H - 16]], geo);
}

function updateSlider() {
  const { W, H } = dims();
  const x = sliderX;
  clipRect.attr("x", x).attr("y", 0).attr("width", W - x).attr("height", H);
  sliderHit.attr("x", x - 16).attr("height", H);
  sliderLine.attr("x1", x).attr("y1", 0).attr("x2", x).attr("y2", H);
  sliderHandle.attr("cx", x).attr("cy", H / 2);
  svg.select("text").attr("x", x).attr("y", H / 2);
}

sliderGroup.call(
  d3.drag().on("start drag", function(event) {
    const { W } = dims();
    sliderX = Math.max(80, Math.min(W - 80, event.x));
    updateSlider();
  })
);

window.addEventListener("resize", () => { if (compareMode) updateSlider(); });

function senateColor(d)     { return SENATE_COLORS[d.properties["Senate 2026_Vote"]] || BASE_COLOR; }
function senateColor2020(d) { return SENATE_COLORS[d.properties["Senate 2020_Vote"]] || BASE_COLOR; }

function showTooltip(event, d) {
  const dist  = d.properties.District;
  const wrapR = mapWrap.getBoundingClientRect();
  let html;

  if (compareMode) {
    const f20 = lookup2020.get(dist);
    const f26 = lookup2026.get(dist);
    const AS  = "border-bottom:none;margin-bottom:3px;padding-bottom:0";
    const v20 = f20?.properties["Senate 2020_Vote"]  || "";
    const v26 = f26?.properties["Senate 2026_Vote"]  || "";
    const c20 = SENATE_COLORS[v20] || "#7f918a";
    const c26 = SENATE_COLORS[v26] || "#7f918a";
    html =
      `<div class="tt-dist">District ${dist}</div>` +
      `<div class="tt-compare-label">2020</div>` +
      `<div class="tt-agg" style="color:${c20};${AS}">${v20}</div>` +
      `<div class="tt-row">
        <span class="tt-name">${f20?.properties["Senate 2020_First"] || ""} ${f20?.properties["Senate 2020_Last"] || ""}</span>
        <span class="tt-party ${f20?.properties["Senate 2020_Party"] || ""}">${f20?.properties["Senate 2020_Party"] || ""}</span>
        <span class="tt-vote ${v20}">${v20}</span>
      </div>` +
      `<div class="tt-sep"></div>` +
      `<div class="tt-compare-label">2026</div>` +
      `<div class="tt-agg" style="color:${c26};${AS}">${v26}</div>` +
      `<div class="tt-row">
        <span class="tt-name">${f26?.properties["Senate 2026_First"] || ""} ${f26?.properties["Senate 2026_Last"] || ""}</span>
        <span class="tt-party ${f26?.properties["Senate 2026_Party"] || ""}">${f26?.properties["Senate 2026_Party"] || ""}</span>
        <span class="tt-vote ${v26}">${v26}</span>
      </div>`;
  } else {
    const vote  = d.properties["Senate 2026_Vote"]  || "";
    const first = d.properties["Senate 2026_First"] || "";
    const last  = d.properties["Senate 2026_Last"]  || "";
    const party = d.properties["Senate 2026_Party"] || "";
    const aggColor = SENATE_COLORS[vote] || "#7f918a";
    html =
      `<div class="tt-dist">District ${dist}</div>` +
      `<div class="tt-agg" style="color:${aggColor}">${vote}</div>` +
      `<div class="tt-row">
        <span class="tt-name">${first} ${last}</span>
        <span class="tt-party ${party}">${party}</span>
        <span class="tt-vote ${vote}">${vote}</span>
      </div>`;
  }

  tooltip.innerHTML = html;
  tooltip.style.opacity = "1";

  const tx = event.clientX - wrapR.left;
  const ty = event.clientY - wrapR.top;
  const tw = tooltip.offsetWidth  || 220;
  const th = tooltip.offsetHeight || 80;
  const { W, H } = dims();
  tooltip.style.left = (tx + 14 + tw > W ? tx - tw - 10 : tx + 14) + "px";
  tooltip.style.top  = (ty - 10 + th > H ? ty - th - 4  : ty - 10) + "px";
}

function hideTooltip() {
  tooltip.style.opacity = "0";
}

function renderLegend() {
  document.getElementById("legend").innerHTML = SENATE_LEGEND.map(i =>
    `<span class="legend-item">
      <span class="legend-swatch" style="background:${i.color}"></span>${i.label}
    </span>`
  ).join("");
}

function draw() {
  lookup2026 = new Map(senateGeo.features.map(f => [f.properties.District, f]));
  lookup2020 = new Map(senateGeo2020.features.map(f => [f.properties.District, f]));

  const proj   = buildProjection(senateGeo);
  const pathFn = d3.geoPath().projection(proj);

  if (compareMode) {
    if (sliderX === null) sliderX = dims().W / 2;
    sliderGroup.style("display", null);
    d3.select("#compare-label-left").style("display", "block");
    d3.select("#compare-label-right").style("display", "block");
    updateSlider();
  } else {
    const { W, H } = dims();
    clipRect.attr("x", 0).attr("y", 0).attr("width", W).attr("height", H);
    sliderGroup.style("display", "none");
    d3.select("#compare-label-left").style("display", "none");
    d3.select("#compare-label-right").style("display", "none");
  }

  g2020.selectAll("path.district")
    .data(compareMode ? senateGeo2020.features : [], d => d.properties.GEOID)
    .join(
      enter => enter.append("path")
        .attr("class", "district")
        .attr("d", pathFn)
        .attr("fill", senateColor2020)
        .on("mousemove", (evt, d) => showTooltip(evt, d))
        .on("mouseleave", hideTooltip),
      update => update.transition().duration(380).ease(d3.easeCubicOut).attr("fill", senateColor2020),
      exit => exit.remove()
    );

  g2026.selectAll("path.district")
    .data(senateGeo.features, d => d.properties.GEOID)
    .join(
      enter => enter.append("path")
        .attr("class", "district")
        .attr("d", pathFn)
        .attr("fill", senateColor)
        .on("mousemove", (evt, d) => showTooltip(evt, d))
        .on("mouseleave", hideTooltip),
      update => update.transition().duration(380).ease(d3.easeCubicOut).attr("fill", senateColor)
    );

  renderLegend();
}

document.getElementById("btn-compare").addEventListener("click", () => {
  compareMode = !compareMode;
  document.getElementById("btn-compare").classList.toggle("active", compareMode);
  hideTooltip();
  draw();
});

Promise.all([
  d3.json("../vote-map-wa/senate_aggregate.geojson"),
  d3.json("../vote-map-wa/2020_senate_aggregate.geojson"),
]).then(([senate, senate20]) => {
  senateGeo     = senate;
  senateGeo2020 = senate20;
  draw();
}).catch(() => {
  mapWrap.innerHTML =
    `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#7f918a;font-size:14px;font-family: var(--sans);">
      Could not load district data.
    </div>`;
});
</script>
<script>
  new ResizeObserver(() => {
    const h = document.documentElement.scrollHeight;
    if (h > 0) window.parent.postMessage({ type: 'iframe-resize', height: h }, '*');
  }).observe(document.documentElement);
</script>
</body>
</html>
